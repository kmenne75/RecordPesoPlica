<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4e78"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="styles.css"><title>Peso & Plica</title></head><body><header><h1>Peso & Plica</h1><button id="install" hidden>Installa</button></header><nav><button data-v="today" class="active">Oggi</button><button data-v="calendar">Calendario</button><button data-v="history">Storico</button><button data-v="data">Dati</button></nav><main><section id="today" class="view active"><div class="card"><h2>Nuova rilevazione</h2><form id="form"><label>Data<input id="date" type="date" required></label><div class="grid"><label>Peso (kg)<input id="weight" type="number" inputmode="decimal" step="0.01"></label><label>Plica addominale (mm)<input id="fold" type="number" inputmode="decimal" step="0.1"></label></div><label>Note<textarea id="notes" rows="3"></textarea></label><button class="primary">Salva rilevazione</button><button id="delete" class="danger" type="button" hidden>Elimina rilevazione</button></form><p id="msg"></p></div><div id="stats" class="stats"></div></section><section id="calendar" class="view"><div class="bar"><button id="prev">‹</button><h2 id="month"></h2><button id="next">›</button></div><div class="week"><b>L</b><b>M</b><b>M</b><b>G</b><b>V</b><b>S</b><b>D</b></div><div id="cal" class="cal"></div></section><section id="history" class="view"><div class="card"><h2>Storico</h2><div id="list"></div></div></section><section id="data" class="view"><div class="card"><h2>Backup</h2><div id="backupStatus" class="status"></div><p>L'archivio operativo rimane sul dispositivo. Crea periodicamente una copia esterna JSON.</p><button id="backup" class="primary">Esegui backup JSON</button><label class="file">Ripristina backup JSON<input id="restore" type="file" accept="application/json" hidden></label></div><div class="card"><h2>Esportazione</h2><button id="csv">Esporta CSV</button></div><div class="card"><h2>Archivio</h2><button id="clear" class="danger">Cancella tutti i dati</button></div></section></main><script src="app.js"></script></body></html>
